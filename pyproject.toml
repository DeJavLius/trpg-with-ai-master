[project]
name = "rag-with-trpg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DeJavLiusMac", email = "lmo9903@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    #    "anthropic>=0.121.0",
    "python-dotenv>=1.2.3",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "numpy>=2.5.2",
    "sentence-transformers>=5.7.0",
    "beautifulsoup4>=4.15.0",
    "transformers==5.16.1",
    "huggingface-hub>=1.27.0",
]

[project.scripts]
rag-with-trpg = "rag_with_trpg:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# 네트워크를 타는 테스트는 이 마커를 달고 기본 실행에서 뺀다 (-m "not network")
markers = ["network: 실제 사이트에 요청한다"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
# corpora/ 는 CC BY 코퍼스 산출물이다 (D-06). 포매터가 만지지 않는다
extend-exclude = ["corpora"]

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"
